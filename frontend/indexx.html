<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda Admin</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

  <div class="topbar">
    <div class="toggle-wrap" onclick="toggleTheme()">
      <span class="toggle-icon" id="theme-icon">☀️</span>
      <span class="toggle-text" id="theme-text">Claro</span>
      <div class="track"><div class="thumb"></div></div>
    </div>
  </div>

  <div class="login-page">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M4 10h12M10 4l6 6-6 6" stroke="#085041" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">Tienda Admin</span>
      </div>

      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@gmail.com"/>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••"/>
      </div>

      <div class="forgot">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-login" onclick="handleLogin()">Ingresar</button>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
